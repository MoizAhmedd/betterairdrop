# Tests on every push to main (and on demand). Each suite runs under a time limit, so a hang
# names its suite instead of stalling the job.
name: ci
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Package.*", ".github/workflows/ci.yml", "scripts/ci-test.sh"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-test.sh
