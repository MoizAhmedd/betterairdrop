name: Deploy site to GitHub Pages
# https://moizahmedd.github.io/betterairdrop/: site/public, plus /install (scripts/install.sh) and
# /appcast.xml (Sparkle feed, rebuilt from every release's appcast-item.xml). release.yml
# dispatches this after each release.

on:
  push:
    branches: [main]
    paths:
      - 'site/public/**'
      - 'scripts/install.sh'
      - 'scripts/release/build-appcast.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Add the installer and the Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site && cp -R site/public/. _site/
          cp scripts/install.sh _site/install
          cp scripts/install.sh _site/install.sh
          scripts/release/build-appcast.sh > _site/appcast.xml
          echo "appcast items: $(grep -c '<item>' _site/appcast.xml || true)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
